<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#fdf4ff;min-height:100vh;padding:20px 16px 40px;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto}
.header{text-align:center;margin-bottom:20px}
.badge{display:inline-block;background:linear-gradient(135deg,#fdf4ff,#fce7f3);color:#a21caf;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:10px}
h1{font-size:22px;font-weight:800;color:#1a1a1a;margin-bottom:4px}
.subtitle{font-size:13px;color:#888}
.search-wrap{margin-bottom:14px}
.search-wrap input{width:100%;padding:11px 16px;border:1.5px solid #fae8ff;border-radius:12px;font-size:13px;font-family:inherit;background:white;outline:none;color:#1a1a1a;transition:border .2s}
.search-wrap input:focus{border-color:#d946ef}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid #fae8ff;background:white;font-size:12px;font-weight:700;cursor:pointer;color:#aaa;transition:all .15s;white-space:nowrap}
.cat-btn.active{background:linear-gradient(135deg,#d946ef,#f472b6);color:white;border-color:transparent}
.cat-btn.new-cat{border-color:#d946ef;color:#a21caf}
.cat-btn.new-cat.active{background:linear-gradient(135deg,#d946ef,#f472b6);color:white}
.layout{display:grid;grid-template-columns:200px 1fr;gap:12px}
@media(max-width:540px){.layout{grid-template-columns:1fr}}
.sidebar{display:flex;flex-direction:column;gap:6px}
.sub-btn{padding:9px 12px;border-radius:10px;border:1.5px solid #fae8ff;background:white;font-size:12px;font-weight:600;cursor:pointer;color:#555;text-align:left;transition:all .15s;line-height:1.4}
.sub-btn:hover{border-color:#d946ef;color:#a21caf}
.sub-btn.active{background:linear-gradient(135deg,#fdf4ff,#fce7f3);color:#a21caf;border-color:#d946ef}
.main{display:flex;flex-direction:column;gap:10px}
.tpl-card{background:white;border-radius:14px;border:1px solid #fae8ff;box-shadow:0 2px 10px rgba(180,0,180,0.05);overflow:hidden}
.tpl-card.new-tpl{border-color:#d946ef;box-shadow:0 2px 14px rgba(217,70,239,0.12)}
.tpl-head{padding:11px 14px;background:linear-gradient(135deg,#fdf4ff,#fce7f3);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tpl-head.new-head{background:linear-gradient(135deg,#fdf4ff,#fce7f3);border-bottom:2px solid #f0abfc}
.tpl-name{font-size:12px;font-weight:800;color:#a21caf}
.tpl-when{font-size:11px;color:#c084fc;font-style:italic}
.new-badge{font-size:10px;font-weight:800;color:white;background:#d946ef;padding:2px 8px;border-radius:10px;letter-spacing:0.5px}
.tpl-body{padding:14px}
.tpl-text{background:#fdf4ff;border-left:3px solid #d946ef;border-radius:0 8px 8px 0;padding:12px 14px;font-size:13px;color:#333;line-height:1.75;white-space:pre-wrap;font-family:inherit}
.copy-btn{margin-top:10px;padding:8px 16px;border-radius:8px;border:1.5px solid #fae8ff;background:white;font-size:12px;font-weight:700;cursor:pointer;color:#a21caf;transition:all .15s;width:100%}
.copy-btn:hover{background:linear-gradient(135deg,#d946ef,#f472b6);color:white;border-color:transparent}
.copy-btn.copied{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:13px}
.footer{text-align:center;font-size:11px;color:#ccc;margin-top:20px}
.footer strong{color:#d946ef}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div class="badge">Бонус к курсу</div>
  <h1>Шаблоны сообщений</h1>
  <p class="subtitle">Более 55 готовых шаблонов · выбери ситуацию и скопируй</p>
</div>

<div class="search-wrap">
  <input type="text" id="search" placeholder="Поиск по шаблонам..." oninput="doSearch()">
</div>

<div class="cats" id="cats"></div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div class="footer">Бонус к курсу <strong>«Профессия: продажи»</strong> · Ангелина Голикова</div>
</div>

<script>
const data=[
{cat:"Первый ответ",subs:[
{name:"Быстрый ответ + конкретика",when:"Когда ты занята, но хочешь показать что видишь клиента",templates:[
{text:`Привет, [Имя]! 😊
Спасибо, что написала! Вижу твоё сообщение, сейчас немного занята, но через 15 минут освобожусь и детально всё расскажу.

А пока вот базовая инфа:
[Краткое описание услуги]
Стоимость от [цена]
Срок [время]

Кстати, у тебя уже есть [что-то связанное с услугой]? Это поможет мне подготовить для тебя точное предложение 😊`}
]},
{name:"Активный подход — сразу с вопросами",when:"Когда запрос общий: «Сколько стоит?» без деталей",templates:[
{text:`Привет, [Имя]! Рада, что написала 🙌
Давай сразу по делу, чтобы дать тебе максимально точную информацию!

Расскажи:
— Какой результат хочешь получить?
— Есть ли сроки?
— С чем уже работала раньше (если работала)?

Как отвечу на эти вопросы, смогу предложить идеальный вариант именно для тебя!`}
]},
{name:"С бонусом для новых клиентов",when:"Когда есть акция или хочешь замотивировать на быстрое решение",templates:[
{text:`Привет, [Имя]! 😊
Отлично, что написала сейчас! Как раз для новых клиентов действует [бонус/скидка].

[Название услуги] включает:
— [пункт 1]
— [пункт 2]
— [пункт 3]

Стоимость [цена], но для тебя [цена со скидкой] до конца недели.

Расскажи немного о твоей ситуации — что хочешь получить? Подберу оптимальный вариант!`}
]},
{name:"Клиент спрашивает «Сколько стоит?»",when:"Когда запрос без деталей",templates:[
{text:`Привет, [Имя]!
Стоимость [услуга] от [мин.цена] до [макс.цена] — зависит от объёма работы и задач.

Чтобы назвать точную цену, давай уточню:
— [вопрос 1]
— [вопрос 2]

Кстати, сейчас для новых клиентов скидка 10% 😊
Когда планируешь стартовать?`},
{text:`Привет, [Имя]! 😊
У меня есть 3 пакета под разные задачи:

📦 БАЗОВЫЙ — [краткое описание]
📦 СТАНДАРТ — [краткое описание] (самый популярный!)
📦 VIP — [краткое описание]

Какой ближе по задачам? Расскажу подробнее!`}
]}
]},
{cat:"Возражение: Дорого",subs:[
{name:"Уточнение + ценность",templates:[{text:`Понимаю твои сомнения, [Имя]!
Давай разберёмся — дорого по сравнению с чем? С другими специалистами или с бюджетом?

В стоимость входит:
— [ценность 1]
— [ценность 2]
— [ценность 3]

Плюс я даю гарантию [какую].

А ты уже работал с кем-то в этой нише? С чем сравниваешь?`}]},
{name:"Разбивка на мелкие суммы",templates:[{text:`Я тебя понимаю! Сумма сразу кажется большой 😅

Давай посчитаем по-другому:
[Услуга] стоит [цена]. Это на [срок]. Если разбить — [цена в день] в день.

Это меньше, чем [сравнение — кофе, такси, обед].

А результат останется с тобой навсегда! Как тебе такая математика? 😊`}]},
{name:"Стоимость бездействия",templates:[{text:`Понимаю! Давай посчитаем иначе 💡

Сейчас ты [описание проблемы]. Это теряет тебе примерно [сумма/время] в месяц.
За [срок] без решения потеряешь [сумма].

Моя услуга стоит [цена] и решает это навсегда. Экономия очевидна, согласен?`}]},
{name:"Варианты оплаты",templates:[{text:`[Имя], понимаю тебя!

Хорошая новость — есть несколько вариантов:
💳 Рассрочка на [срок] — по [сумма] в месяц
💳 Уменьшенный пакет — [цена] (убираем [что])
💳 Оплата по этапам

Какой вариант ближе? Обсудим детали!`}]},
{name:"Честный подход",templates:[{text:`Слушай, давай честно 😊
Когда говорят "дорого", обычно это одно из двух:
1. Реально сейчас нет денег
2. Не видишь ценности за эту цену

Скажи прямо — что у тебя? Без обид, просто чтобы понять, как помочь 🙏

Если первое — предложу варианты. Если второе — расскажу подробнее, что получишь.`}]},
{name:"«Именно поэтому» — переворот",templates:[{text:`[Имя], вот именно поэтому я тебе это и предлагаю! 😊

Потому что моя услуга позволит тебе [экономить/зарабатывать].

Смотри: сейчас ты тратишь [сумма] на [что-то]. После моей работы эта статья расходов уменьшится в [раз].

Моя услуга окупится уже через [срок]. Дальше — чистая прибыль!
Как тебе такая математика?`}]},
{name:"Убрать лишнее (даунсейл)",templates:[{text:`Окей, давай посмотрим!

Из чего можем убрать, чтобы уложиться в твой бюджет?

[Полный пакет] стоит [цена]. Но мы можем:
— Убрать [опция 1] → цена [новая цена]
— Оставить только самое важное → цена [новая цена]
— Сделать поэтапно: сначала [этап 1], потом [этап 2]

Главное — решить твою задачу! Какой вариант рассмотрим?`}]}
]},
{cat:"Возражение: Подумаю",subs:[
{name:"Уточнение истинной причины",templates:[{text:`Конечно, [Имя]! Решение важное, понимаю 😊

А о чём конкретно хочешь подумать? Может, я что-то не объяснила, или есть вопросы?

Часто за "подумаю" скрывается какое-то сомнение. Скажи честно — что смущает? Давить не буду, просто помогу разобраться 🙏`}]},
{name:"Выявление скрытых возражений",templates:[{text:`Хорошо, понимаю!

По опыту знаю — когда говорят "подумаю", обычно есть что-то конкретное 😅

Это цена смущает? Или сроки? Или сомневаешься в результате?

Давай обсудим открыто — так быстрее разберёмся! И мне тоже полезна обратная связь 😊`}]},
{name:"Мягкая срочность",templates:[{text:`Хорошо, [Имя]! Сколько времени нужно на раздумья?

Просто хочу предупредить: [условие] действует до [дата]. После будет [другие условия].

Давай так — я напишу тебе [через сколько], обсудим. Договорились? 😊`}]},
{name:"По 10-балльной шкале",templates:[{text:`[Имя], давай так 💡

По 10-балльной шкале, как оцениваешь моё предложение?

[Если 7-10]: Круто! А что мешает поставить 10? Что нужно добавить или изменить?
[Если 1-6]: Понял. А что конкретно не нравится? Давай разберём!`}]},
{name:"Идеальное предложение",templates:[{text:`[Имя], а давай сыграем в игру? 😊

Каким должно быть моё предложение, чтобы ты согласился без раздумий?

[Клиент говорит своё видение]

Окей! Вот из этого списка я могу сделать: [перечисляешь]. Теперь подходит?`}]}
]},
{cat:"Возражение: Нет времени",subs:[
{name:"Экономия времени — главный аргумент",templates:[{text:`[Имя], как раз поэтому моя услуга и нужна! 😅

Ты сейчас тратишь на [задача] сколько времени в неделю?

После моей работы будешь тратить [меньше] или вообще не тратить.
Плюс я беру всю рутину на себя — тебе только результаты получать 😊

Давай созвонимся на 15 минут, покажу как это работает?`}]},
{name:"Минимальное участие",templates:[{text:`Понимаю, все загружены!

Хорошая новость — от тебя нужно минимум:
— [действие 1] — 10 минут
— [действие 2] — 20 минут раз в неделю

Всё остальное я беру на себя. Ты просто получаешь результат.

Давай попробуем? Если не зайдёт — остановимся.`}]},
{name:"Отложенный старт",templates:[{text:`Понял тебя, [Имя]!

А когда у тебя появится время? Через неделю? Через месяц?

Могу записать тебя на [дата] — к тому времени освободишься, и начнём.

Так не упустим момент, и тебе не нужно волноваться сейчас. Как вариант?`}]},
{name:"«Именно поэтому» — для нет времени",templates:[{text:`[Имя], именно поэтому я и пишу! 😊

Чтобы заранее подготовить всё и сэкономить твоё время.

Мне нужно всего 10 минут, чтобы зафиксировать твои задачи. Дальше я всё сделаю сама.

Сегодня вечером будет удобно или завтра утром?`}]}
]},
{cat:"Другие возражения",subs:[
{name:"Уже есть специалист",templates:[
{text:`Отлично, [Имя]! Значит, понимаешь важность [направление] 😊

А скажи, уже есть результаты? Всё супер?

Часто ко мне приходят даже те, у кого есть специалист, но хотят:
— Усилить команду
— Получить второе мнение
— Закрыть задачу, с которой текущий не справляется

У тебя какая ситуация?`},
{text:`Супер! У вас уже есть [специалист] 👍

Я не предлагаю замену — скорее дополнение.
Мой фокус на [твоя специализация]. Это как раз усилит результат вашего текущего специалиста.

Интересно было бы обсудить совместную работу?`}
]},
{name:"Нужно посоветоваться",templates:[
{text:`Конечно, [Имя]! Решение важное, правильно советоваться 😊

А что ты расскажешь [муж/партнёр]? Как он обычно реагирует на такие инвестиции?

Может, помочь с аргументами? Отправлю детали, которые можно показать:
— Примеры результатов
— Отзывы
— План работы

Так будет проще обсудить!`},
{text:`Отличная идея посоветоваться!

А может, созвонимся втроём? Я всё расскажу, отвечу на вопросы, и вы вместе примете решение.

Так честнее и быстрее. Когда вам обоим будет удобно?`}
]},
{name:"Сомневается в результате",templates:[{text:`[Имя], твои сомнения абсолютно нормальны! Я бы тоже сомневалась 😊

Поэтому у меня:
✅ Гарантия: [какая]
✅ Кейсы: вот 3 клиента с похожей ситуацией [ссылки/скрины]
✅ [количество] довольных клиентов

Плюс можем начать с [тестовая задача] — так убедишься в результате без рисков.

Как тебе такой вариант?`}]},
{name:"Сейчас не актуально",templates:[
{text:`Поняла тебя, [Имя]!

А когда планируешь, что станет актуально? Через месяц? Через полгода?

Могу записать тебя в лист ожидания и напомнить в нужное время. Так не упустим момент!

Плюс отправлю полезные материалы по [тема], чтобы ты была в курсе 😊`},
{text:`Хорошо! А можно уточнить — почему сейчас не актуально?

По опыту знаю: то, что кажется "не срочным" сейчас, через 3 месяца становится "горящей" проблемой 😅

И тогда решать приходится в аврале и дороже.

Давай хотя бы обсудим — может, есть смысл закрыть вопрос сейчас спокойно?`}
]},
{name:"Плохие отзывы / негативный опыт",templates:[{text:`[Имя], спасибо, что подняла этот вопрос! Давай разберёмся 😊

Какой конкретно отзыв смутил? Дай ссылку, хочу посмотреть.

Да, бывают недовольные клиенты — это нормально. Но важно соотношение:
— Положительных: [количество]
— Негативных: [количество]

Могу дать контакты реальных клиентов — пообщаешься напрямую. Так честнее, согласна?`}]}
]},
{cat:"Работа с базой",subs:[
{name:"Напоминание через ценность",when:"Клиент отказал 2 месяца назад",templates:[{text:`Привет, [Имя]! Как дела? 😊

Помнишь, мы с тобой общались пару месяцев назад про [услугу]. Ты тогда сказал, что не актуально.

Решила написать, потому что недавно [сделала что-то новое]: [Полезная инфа для клиента]

Подумала, что тебе может быть интересно!

Кстати, как у тебя дела с [его задача]? Получилось решить?`}]},
{name:"Напоминание через акцию",when:"Клиент хотел подумать",templates:[{text:`[Имя], привет! Давно не общались 🙌

Помнишь, мы обсуждали [услуга]? Ты хотел подумать.

У меня сейчас [акция] — подумала сразу про тебя!

[Краткое описание акции]

Актуально сейчас, или всё ещё не время?`}]},
{name:"Персонализированное напоминание",when:"Используй деталь из прошлого разговора!",templates:[{text:`Привет, [Имя]! 😊

Помню, ты планировал [что-то из разговора — переезд, событие]. Как всё прошло?

Кстати, про [услугу], о которой мы говорили — как в итоге решил вопрос? Нашёл кого-то или сам справился?

Если ещё актуально — готова помочь! У меня сейчас [бонус] 😊`}]},
{name:"Апсейл — дополнительная услуга",when:"Клиент уже купил",templates:[{text:`Привет, [Имя]! Как тебе [услуга]? Всё нравится? 😊

Слушай, подумала про тебя! Есть ещё одна штука, которая усилит результат:
[Описание дополнительной услуги]

Обычно клиенты берут это через [срок] после основной услуги, когда видят первые результаты.

У тебя как раз сейчас самое время! Интересно? Расскажу подробнее 😊`}]},
{name:"Реактивация — проверка «как дела»",templates:[{text:`Привет, [Имя]! Давно не общались 😊

Как у тебя дела с [результат от услуги]? Всё ещё работает?

Если есть вопросы или нужна помощь — пиши, помогу!

Кстати, ты не знаешь случайно кого-то, кому актуальна моя услуга? Буду благодарна за рекомендацию 🙏`}]},
{name:"Сбор отзыва + реактивация",templates:[{text:`Привет, [Имя]!

let curCat=0,curSub=0,searchMode=false;

function renderCats(){
  document.getElementById('cats').innerHTML=data.map((c,i)=>
    `<button class="cat-btn ${c.isNew?'new-cat':''} ${i===curCat&&!searchMode?'active':''}" onclick="setCat(${i})">${c.cat}</button>`
  ).join('');
}

function renderSidebar(){
  if(searchMode){document.getElementById('sidebar').innerHTML='';return;}
  document.getElementById('sidebar').innerHTML=data[curCat].subs.map((s,i)=>
    `<button class="sub-btn ${i===curSub?'active':''}" onclick="setSub(${i})">${s.name}</button>`
  ).join('');
}

function renderMain(subs){
  const items=subs||[data[curCat].subs[curSub]];
  let html='';
  items.forEach(sub=>{
    sub.templates.forEach((t,ti)=>{
      const id=`tpl_${Math.random().toString(36).slice(2)}`;
      html+=`<div class="tpl-card ${sub.isNew?'new-tpl':''}">
        <div class="tpl-head ${sub.isNew?'new-head':''}">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="tpl-name">${sub.name}</div>
            ${sub.isNew?'<span class="new-badge">НОВОЕ</span>':''}
          </div>
          ${sub.when?`<div class="tpl-when">${sub.when}</div>`:''}
        </div>
        <div class="tpl-body">
          <div class="tpl-text" id="${id}">${t.text}</div>
          <button class="copy-btn" onclick="copyTpl('${id}',this)">Скопировать шаблон</button>
        </div>
      </div>`;
    });
  });
  document.getElementById('main').innerHTML=html||`<div class="empty">Ничего не найдено 🔍</div>`;
}

function setCat(i){curCat=i;curSub=0;searchMode=false;document.getElementById('search').value='';renderCats();renderSidebar();renderMain();}
function setSub(i){curSub=i;renderSidebar();renderMain();}

function doSearch(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  if(!q){searchMode=false;renderCats();renderSidebar();renderMain();return;}
  searchMode=true;
  renderCats();renderSidebar();
  const results=[];
  data.forEach(cat=>cat.subs.forEach(sub=>{
    const match=sub.name.toLowerCase().includes(q)||sub.templates.some(t=>t.text.toLowerCase().includes(q))||(sub.when&&sub.when.toLowerCase().includes(q));
    if(match)results.push(sub);
  }));
  renderMain(results.length?results:null);
}

function copyTpl(id,btn){
  const txt=document.getElementById(id).innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='Скопировано ✓';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Скопировать шаблон';btn.classList.remove('copied');},2000);
  }).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.textContent='Скопировано ✓';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Скопировать шаблон';btn.classList.remove('copied');},2000);
  });
}

renderCats();renderSidebar();renderMain();
</script>
